# 部署：GitHub Pages（唯一推荐）
# 构建的是 site-react 线（v6 视觉真身），产物 site-react/dist。
# 根目录 Astro 线自 2026-10-15 起不再部署，仅作为历史版本保留。
# 推送 main 后自动构建并发布到 Pages。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site-react/package-lock.json
      - name: Install
        run: npm ci
        working-directory: site-react
      - name: Build
        run: npm run build
        working-directory: site-react
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4