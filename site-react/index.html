    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="PERSONAL DOSSIER" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://gassamflower.github.io/PersonalWebsite/#person",
            "name": "一个故事",
            "alternateName": ["One Story", "gassamflower"],

            "url": "https://gassamflower.github.io/PersonalWebsite/",
            "sameAs": ["https://github.com/gassamflower"],
            "knowsLanguage": ["zh-CN", "en"],
            "knowsAbout": [
              "内部系统建设",
              "数据与流程整理",
              "私有化内网部署",
              "微信小程序",
              "React / Vue",
              "Go 后端",

            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://gassamflower.github.io/PersonalWebsite/#website",
            "url": "https://gassamflower.github.io/PersonalWebsite/",
            "name": "PERSONAL DOSSIER",
            "inLanguage": ["zh-CN", "en"],
            "publisher": { "@id": "https://gassamflower.github.io/PersonalWebsite/#person" }
          }
        ]
      }

  </head>
